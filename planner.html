<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly planner · Analytics Toolkit</title>
  <meta name="description" content="A simple weekly planner that lives in a browser tab. Everything is saved locally.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/planner.css">
</head>
<body>
  <header class="topnav">
    <div class="topnav-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h9M8 12h10M6 18h7"/></svg>
        </span>
        <span class="brand-name">Analytics Toolkit</span>
      </a>
      <nav class="nav-links" aria-label="Tools">
        <a href="roadmap.html">Roadmap</a>
        <a href="planner.html" aria-current="page">Weekly planner</a>
        <a href="list.html">List formatter</a>
      </nav>
      <span class="nav-spacer"></span>
      <a class="nav-github" href="https://github.com/Renarion/analytics-toolkit" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>GitHub</span>
      </a>
    </div>
  </header>

  <div class="page">
    <header class="planner-head">
      <div>
        <h1>Weekly planner</h1>
        <p class="week-range" id="week-range"></p>
      </div>
      <div class="planner-side">
        <div class="progress-card" aria-live="polite">
          <div class="progress-top">
            <span class="progress-pct" id="progress-pct">0%</span>
            <span class="progress-count" id="progress-count">No tasks yet</span>
          </div>
          <div class="progress-track"><span id="progress-fill"></span></div>
        </div>
        <div class="planner-actions">
          <button type="button" class="btn btn-secondary" id="copy-md-btn">Copy as Markdown</button>
          <button type="button" class="btn btn-ghost btn-danger-text" id="delete-all-btn">Delete all tasks</button>
        </div>
      </div>
    </header>

    <main class="planner">
      <section class="days" id="days" aria-label="Days of the week"></section>

      <div class="planner-bottom">
        <section class="panel list-panel">
          <h2>Backlog</h2>
          <div id="backlog"></div>
        </section>
        <section class="panel list-panel">
          <h2><label for="notes">Notes</label></h2>
          <textarea id="notes" class="input notes-input" placeholder="Notes, links, ideas…"></textarea>
        </section>
      </div>

      <p class="save-status mono" id="save-status" aria-live="polite"></p>
    </main>

    <footer class="footer">
      <p>Runs entirely in your browser · data is stored locally</p>    </footer>
  </div>

  <p class="toast" id="toast" hidden role="status"></p>

  <script src="js/planner.js"></script>
</body>
</html>
